name = "sharp-ai"
main = "src/index.js"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

[vars]
# --- retrieval -------------------------------------------------------------
# gemini-3.5-flash takes 1,048,576 input tokens. At TOP_K=6 we were sending
# ~1,700 — 0.16% of the window — and refusing to answer questions whose
# evidence sat at rank 7. Sixteen sections is ~4,400 tokens, still under half a
# percent, and the model is instructed to ignore sections that do not help.
TOP_K            = "16"
CANDIDATES       = "48"
# Relevance gate, tuned by ingest/src/eval.js against 10 real FTC questions and
# 5 deliberately off-topic probes (0 false positives, 0 false negatives).
MIN_COSINE       = "0.60"     # a confident embedding match passes on its own
FLOOR_COSINE     = "0.46"     # below this nothing passes, whatever BM25 says
MIN_BM25         = "8.0"      # keyword-led pass needs a strong BM25 ...
MIN_OVERLAP      = "1"        # ... and both retrievers agreeing on a chunk ...
MIN_COVERAGE     = "0.5"      # ... and half the question's terms present
# --- abuse + quota ---------------------------------------------------------
RATE_PER_MIN     = "10"
# Was 100. An escalated question costs 3 LLM calls, so a single IP at the old
# limit could spend 300 — the entire global daily ceiling — and leave everyone
# else on the degraded no-summary path. 25 questions caps one visitor at 75.
RATE_PER_DAY     = "25"
# A verified account is metered on its own, so the allowance can be larger
# without a lab full of students sharing one address sharing one budget.
# Gemini free tier is the real ceiling; KV's 1000 writes/day sits just above the
# ~3 writes each uncached question costs, so these two numbers move together.
# Counts LLM CALLS, not questions. A confident question costs one call; an
# escalated one costs three (plan + rerank + answer).
LLM_DAILY_CEILING = "300"
MAX_QUESTION_CHARS = "500"
# --- model -----------------------------------------------------------------
# Bump after every corpus ingest: it is part of the answer cache key, so
# changing it retires every answer generated against the previous index.
CORPUS_EPOCH     = "2026-09-19"
GEMINI_MODEL     = "gemini-3.7-flash"
# Questions that have to reason rather than fetch are answered by this one.
# Back to Flash. Pro answered harder questions better, but it costs several
# times as much per call and I never checked what that did to the bill before
# switching hard questions onto it. Set this back to a Pro model once billing
# is sorted and the difference is worth paying for.
GEMINI_DEEP_MODEL = "gemini-3.7-flash"
# Planning and reranking are short structured calls; the lite model is enough
# and keeps the agentic pass affordable against the same daily ceiling.
GEMINI_FAST_MODEL = "gemini-3.5-flash-lite"
THINKING_LEVEL   = "low"
# Code needs far more room: thinking is billed from the same budget.
MAX_OUTPUT_TOKENS      = "16384"
MAX_OUTPUT_TOKENS_CODE = "32000"
# The upstream free tier refuses past roughly this many calls a minute. A
# question costs one call, or three if it escalates, so the agentic pass stands
# down once fewer than three remain rather than spending the last of the
# minute on retrieval and having nothing left to answer with.
#
# This number is an ESTIMATE, not a documented figure. Observed: two questions
# that escalated (six calls) were enough to get refused, so the real allowance
# is somewhere near five or six. Deliberately set low — being wrong high means
# questions fail, being wrong low only means fewer of them escalate, and an
# adequately retrieved answer beats a perfectly retrieved refusal. Raise it if
# you ever see escalation standing down while calls are plainly available.
LLM_CALLS_PER_MIN = "6"
AGENTIC          = "true"
# --- site ------------------------------------------------------------------
SITE_ORIGIN = "https://sharpftc.pages.dev,https://sharp-ai-8a1.pages.dev"
REQUIRE_TURNSTILE = "true"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sharp-ai"
database_id = "dc18db74-3fed-4e66-9679-ad59ebc2e98b"

[[vectorize]]
binding = "VECTORIZE"
index_name = "sharp-ai-chunks"

[[kv_namespaces]]
binding = "CACHE"
id = "28ebda3920aa47218af7afa7f8f8ad72"

[[kv_namespaces]]
binding = "RATE"
id = "277faf1d0d6c4be4aecafd611087ad06"

# Secrets (never in this file):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put TURNSTILE_SECRET
